<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }

        h1 {
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 3rem;
        }

        .shops-container {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin: 20px 0;
        }

        .shops-container img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .copyright {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <h1>Welcome to the Store#1 🛒</h1>

    <div class="shops-container">
        <div>
            <img src="https://m.media-amazon.com/images/I/31epF-8N9LL.png" alt="Amazon">
            <br>
            <a href="https://www.amazon.com/">Amazon</a>
        </div>

        <div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwlqHmyGFU8cYqhR4K4AnFzE_6dy1KSYUfHx6e1XpF-B_c3KONMElzOOo&s=10" alt="ebay">
            <br>
            <a href="https://www.ebay.com/">ebay</a>
        </div>
    </div>

    <hr>

    <div class="copyright">
        &copy; wil2026
    </div>

</body>

</html>
